name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "*.tf"
      - ".terraform.lock.hcl"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      reset_primary_for_bootstrap:
        description: "Starta om endast team2-primary efter apply så att dess startup-script körs"
        required: false
        default: false
        type: boolean

concurrency:
  group: terraform-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CICD_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Restart primary for approved K3s bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_primary_for_bootstrap }}
        run: |
          project="itsx25-comerit"
          zone="europe-north2-b"

          wait_for_running() {
            local instance="$1"

            for attempt in $(seq 1 24); do
              status="$(gcloud compute instances describe "$instance" \
                --project "$project" \
                --zone "$zone" \
                --format='value(status)')"

              if [ "$status" = "RUNNING" ]; then
                echo "$instance is running"
                return 0
              fi

              echo "Waiting for $instance; current status: $status"
              sleep 5
            done

            echo "$instance did not reach RUNNING within two minutes" >&2
            return 1
          }

          jumphost_status="$(gcloud compute instances describe team2-jumphost \
            --project "$project" \
            --zone "$zone" \
            --format='value(status)')"

          if [ "$jumphost_status" != "RUNNING" ]; then
            gcloud compute instances start team2-jumphost \
              --project "$project" \
              --zone "$zone"
          fi

          wait_for_running team2-jumphost

          gcloud compute instances reset team2-primary \
            --project "$project" \
            --zone "$zone"
          wait_for_running team2-primary
